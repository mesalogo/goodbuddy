<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外部应用示例页面 - GoodBuddy</title>
<style>
:root {
  --surface-canvas: #e8f0f5; --surface-raised: #fff; --surface-subtle: #f4f8fb; --surface-muted: #e5edf3;
  --text-primary: #17263a; --text-secondary: #4f6278; --text-muted: #60748a;
  --border-default: #cedce7; --border-control: #748a9f; --border-subtle: #e2eaf1;
  --accent: #086fc7; --accent-solid: #0875cf; --accent-subtle: #e8f4ff; --accent-selected: #a7cfea;
  --danger: #c53640; --danger-subtle: #fff1f2; --danger-border: #efbcc2;
  --success: #077466; --success-subtle: #e4f7f2;
  --warning: #a86608; --warning-subtle: #fff7e8; --warning-border: #e8c589;
  --overlay-backdrop: rgb(0 0 0 / 45%); --shadow-dialog: 0 14px 38px rgb(29 78 116 / 14%); --shadow-card: 0 4px 14px rgb(29 78 116 / 7%);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --radius-control: 10px; --radius-card: 14px;
  --font-page-title: 24px; --font-section-title: 14px; --font-body: 13px; --font-caption: 11px;
  font-family: "Segoe UI Variable", "PingFang SC", "Microsoft YaHei UI", sans-serif;
  font-size: var(--font-body); color: var(--text-primary); background: var(--surface-canvas);
}
* { box-sizing: border-box; }
body { margin: 0; height: 100vh; display: flex; flex-direction: column; }
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
input, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }

/* demo toolbar */
.demo-bar { position: relative; z-index: 100; display: flex; gap: var(--space-2); align-items: center; padding: var(--space-2) var(--space-4); background: #17263a; color: #f2f7fb; flex-wrap: wrap; }
.demo-bar strong { margin-right: var(--space-3); }
.demo-bar button { background: transparent; color: inherit; border: 1px solid #4f6278; border-radius: 8px; padding: 3px 10px; }
.demo-bar button.active { background: #0875cf; border-color: #0875cf; }

.shell { flex: 1; display: flex; min-height: 0; position: relative; }

/* sidebar */
.sidebar { width: 240px; display: flex; flex-direction: column; background: rgb(255 255 255 / 65%); border-right: 1px solid var(--border-subtle); padding: var(--space-3); gap: var(--space-1); position: relative; }
.nav-item { display: flex; align-items: center; gap: var(--space-2); background: transparent; border: 0; border-radius: var(--radius-control); padding: 7px var(--space-3); text-align: left; color: var(--text-primary); width: 100%; }
.nav-item:hover { background: var(--surface-muted); }
.nav-item.active { background: var(--accent-subtle); color: var(--accent); font-weight: 600; }
.nav-section { margin: var(--space-3) var(--space-3) var(--space-1); color: var(--text-muted); font-size: var(--font-caption); }
.conversation { padding: 6px var(--space-3); color: var(--text-secondary); border-radius: 8px; }
.sidebar-spacer { flex: 1; }
.sidebar-footer { display: flex; align-items: center; gap: var(--space-2); border-top: 1px solid var(--border-subtle); padding-top: var(--space-2); }
.sidebar-footer .nav-item { justify-content: center; }
.divider-v { width: 1px; height: 24px; background: var(--border-default); }

.menu { position: absolute; left: var(--space-3); bottom: 56px; width: 216px; background: var(--surface-raised); border: 1px solid var(--border-default); border-radius: var(--radius-card); box-shadow: var(--shadow-dialog); padding: var(--space-2); z-index: 20; }
.menu .nav-item { justify-content: flex-start; }
.menu hr { border: 0; border-top: 1px solid var(--border-subtle); margin: var(--space-1) 0; }
.menu-label { font-size: var(--font-caption); color: var(--text-muted); padding: var(--space-1) var(--space-3); }

/* app logos */
.logo { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; color: #fff; font-weight: 700; font-size: 11px; flex: 0 0 auto; }
.logo.lg { width: 36px; height: 36px; border-radius: 9px; font-size: 15px; }
.logo.feishu { background: linear-gradient(135deg, #00d6b9, #3370ff); }
.logo.dingtalk { background: #1677ff; }
.logo.wecom { background: #07c160; }
.logo.weixin { background: #2aae67; }
.logo.telegram { background: #2aabee; }
.logo.builtin { background: var(--surface-muted); color: var(--text-secondary); }

/* main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.page-header { padding: var(--space-6) 32px var(--space-4); display: flex; align-items: flex-start; gap: var(--space-4); }
.page-header h1 { font-size: var(--font-page-title); }
.page-header p { color: var(--text-secondary); margin-top: var(--space-1); }
.page-header .actions { margin-left: auto; display: flex; gap: var(--space-2); }

.btn { border: 1px solid var(--border-default); background: var(--surface-raised); color: var(--text-primary); border-radius: var(--radius-control); padding: 0 var(--space-3); min-height: 32px; display: inline-flex; align-items: center; gap: var(--space-1); white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--border-control); }
.btn.primary { background: var(--accent-solid); border-color: var(--accent-solid); color: #fff; }
.btn.danger { color: var(--danger); border-color: var(--danger-border); }
.btn.ghost { border-color: transparent; background: transparent; }
.icon-btn { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 8px; font-size: 18px; color: var(--text-secondary); }
.icon-btn:hover { background: var(--surface-muted); }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: var(--font-caption); padding: 1px 8px; border-radius: 999px; background: var(--surface-muted); color: var(--text-secondary); white-space: nowrap; }
.badge.ok { background: var(--success-subtle); color: var(--success); }
.badge.warn { background: var(--warning-subtle); color: var(--warning); }
.badge.err { background: var(--danger-subtle); color: var(--danger); }
.badge.info { background: var(--accent-subtle); color: var(--accent); }
.muted { color: var(--text-secondary); }
.caption { font-size: var(--font-caption); color: var(--text-muted); }

/* modal */
.backdrop { position: absolute; inset: 0; background: var(--overlay-backdrop); display: grid; place-items: center; z-index: 50; }
.modal { background: var(--surface-raised); border-radius: var(--radius-card); box-shadow: var(--shadow-dialog); width: min(640px, calc(100vw - 32px)); max-height: calc(100% - 32px); display: flex; flex-direction: column; overflow: hidden; }
.modal.wide { width: min(880px, calc(100vw - 32px)); height: min(680px, calc(100% - 32px)); }
.modal-header { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--border-subtle); }
.modal-header h2 { font-size: var(--font-section-title); font-size: 16px; }
.modal-header p { color: var(--text-secondary); margin-top: 2px; }
.modal-header .grow { flex: 1; min-width: 0; }
.modal-body { padding: var(--space-5) var(--space-6); overflow: auto; flex: 1; min-height: 0; }
.modal-footer { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-3) var(--space-6); border-top: 1px solid var(--border-subtle); }

.search { width: 100%; min-height: 36px; border: 1px solid var(--border-control); border-radius: var(--radius-control); padding: 0 var(--space-3); background: var(--surface-raised); }
.group-title { display: flex; align-items: baseline; gap: var(--space-2); margin: var(--space-5) 0 var(--space-1); font-weight: 600; }
.group-title .caption { font-weight: 400; }
.app-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; flex-wrap: wrap; }
.app-row + .app-row { border-top: 1px solid var(--border-subtle); }
.app-row .summary { display: flex; gap: var(--space-3); flex: 1 1 260px; min-width: 0; align-items: flex-start; }
.app-row .title { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.app-row .title strong { font-size: var(--font-section-title); }
.app-row .summary p { color: var(--text-secondary); margin-top: 2px; line-height: 1.6; }
.app-row .row-actions { display: flex; gap: var(--space-2); margin-left: auto; }
/* chat + right workbar */
.chat-layout { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
.chat-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.workbar { border-left: 1px solid var(--border-subtle); background: rgb(255 255 255 / 70%); display: flex; flex-direction: column; min-height: 0; position: relative; }
.wb-tabs { display: flex; align-items: center; gap: 2px; padding: var(--space-2); border-bottom: 1px solid var(--border-subtle); overflow-x: auto; }
.wb-tab { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; border-radius: 8px; padding: 5px 8px; white-space: nowrap; color: var(--text-secondary); }
.wb-tab.active { background: var(--accent-subtle); color: var(--accent); font-weight: 600; }
.wb-tab .x { opacity: .6; margin-left: 2px; }
.wb-add { margin-left: auto; }
.wb-menu { position: absolute; right: var(--space-2); top: 44px; width: 220px; background: var(--surface-raised); border: 1px solid var(--border-default); border-radius: var(--radius-card); box-shadow: var(--shadow-dialog); padding: var(--space-2); z-index: 10; }
.wb-menu .nav-item:disabled { opacity: .5; }
.wb-body { flex: 1; overflow: auto; padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); }
.wb-body .doc-card { padding: var(--space-3); }
.wb-body .toolbar { flex-wrap: wrap; }
.wb-head { display: flex; align-items: center; gap: var(--space-2); }
.wb-head .grow { flex: 1; min-width: 0; }
.wb-head small { display: block; color: var(--text-muted); font-size: var(--font-caption); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.placeholder { color: var(--text-muted); padding: var(--space-6) var(--space-3); text-align: center; line-height: 1.7; }
@media (max-width: 1000px) { .chat-layout { grid-template-columns: minmax(0, 1fr) 320px; } }
@media (max-width: 760px) { .chat-layout { grid-template-columns: minmax(0, 1fr); } .chat-col { display: none; } }
.order { display: inline-flex; gap: 2px; }
.icon-btn.sm { width: 28px; height: 28px; font-size: 14px; border: 1px solid transparent; }
.icon-btn.sm:disabled { opacity: .35; }
.add-more { margin-top: var(--space-3); padding: var(--space-3); border: 1px dashed var(--border-default); border-radius: var(--radius-control); color: var(--text-secondary); display: flex; align-items: center; gap: var(--space-2); }

/* settings detail */
.detail { display: grid; grid-template-columns: 180px minmax(0, 1fr); height: 100%; min-height: 0; }
.detail nav { border-right: 1px solid var(--border-subtle); padding: var(--space-3); display: flex; flex-direction: column; gap: 2px; background: var(--surface-subtle); }
.detail nav .nav-item { white-space: nowrap; }
.detail nav .nav-item .badge { margin-left: auto; padding: 0 6px; }
.detail section { padding: var(--space-5) var(--space-6); overflow: auto; }
.detail h3 { font-size: var(--font-section-title); margin-bottom: var(--space-1); }
.block { display: grid; gap: var(--space-3); padding-bottom: var(--space-5); }
.block + .block { border-top: 1px solid var(--border-subtle); padding-top: var(--space-5); }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: var(--space-2) var(--space-4); }
.kv dt { color: var(--text-secondary); }
.kv dd { margin: 0; }
.toggle-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; }
.toggle-row .text { flex: 1; min-width: 0; }
.toggle-row .text p { color: var(--text-secondary); margin-top: 2px; }
.switch { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--border-default); position: relative; flex: 0 0 auto; margin: 0; cursor: pointer; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch:checked { background: var(--accent-solid); }
.switch:checked::after { left: 16px; }
.switch:disabled { opacity: .5; cursor: not-allowed; }
.select { min-height: 30px; border: 1px solid var(--border-default); border-radius: 8px; padding: 0 var(--space-2); background: var(--surface-raised); }
.notice { padding: var(--space-3); border-radius: var(--radius-control); background: var(--surface-subtle); color: var(--text-secondary); line-height: 1.6; }
.notice.warn { background: var(--warning-subtle); border: 1px solid var(--warning-border); color: #6e4305; }
.notice.info { background: var(--accent-subtle); color: #0b4f8a; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: var(--space-2); border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
th { color: var(--text-secondary); font-weight: 500; font-size: var(--font-caption); }

/* connect */
.choice { display: flex; gap: var(--space-3); padding: var(--space-4); border: 1px solid var(--border-default); border-radius: var(--radius-card); cursor: pointer; align-items: flex-start; }
.choice + .choice { margin-top: var(--space-3); }
.choice.selected { border-color: var(--accent); background: var(--accent-subtle); }
.choice input { margin-top: 3px; }
.choice p { color: var(--text-secondary); margin-top: 4px; line-height: 1.6; }
.steps { display: flex; gap: var(--space-2); margin-bottom: var(--space-5); }
.steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--border-subtle); }
.steps span.done { background: var(--accent-solid); }
.field { display: grid; gap: var(--space-1); margin-bottom: var(--space-3); }
.field label { color: var(--text-secondary); }
.field input { min-height: 34px; border: 1px solid var(--border-control); border-radius: 8px; padding: 0 var(--space-3); }
.spinner { width: 36px; height: 36px; border: 3px solid var(--border-subtle); border-top-color: var(--accent-solid); border-radius: 50%; animation: spin 1s linear infinite; margin: var(--space-4) auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.scope-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; }
.scope-item + .scope-item { border-top: 1px solid var(--border-subtle); }
.scope-item .grow { flex: 1; }

/* app page */
.app-page { flex: 1; display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 0; border-top: 1px solid var(--border-subtle); }
.tree { padding: var(--space-3); border-right: 1px solid var(--border-subtle); overflow: auto; background: rgb(255 255 255 / 40%); }
.tree .node { padding: 6px var(--space-2); border-radius: 8px; display: flex; gap: var(--space-2); align-items: center; cursor: pointer; }
.tree .node:hover { background: var(--surface-muted); }
.tree .node.active { background: var(--accent-subtle); color: var(--accent); }
.tree .node.locked { color: var(--text-muted); }
.tree .child { padding-left: var(--space-5); }
.results { padding: var(--space-4) 32px; overflow: auto; display: flex; flex-direction: column; gap: var(--space-3); }
.toolbar { display: flex; gap: var(--space-2); align-items: center; }
.toolbar .search { flex: 1; }
.chip { border: 1px solid var(--border-default); background: var(--surface-raised); border-radius: 999px; padding: 2px 10px; }
.chip.active { background: var(--accent-subtle); border-color: var(--accent-selected); color: var(--accent); }
.card { background: var(--surface-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-card); padding: var(--space-4); box-shadow: var(--shadow-card); }
.doc-card { display: grid; gap: var(--space-2); }
.doc-card .head { display: flex; gap: var(--space-2); align-items: center; }
.doc-card .head strong { font-size: var(--font-section-title); }
.doc-card .path { color: var(--text-muted); font-size: var(--font-caption); }
.doc-card .snippet { color: var(--text-secondary); line-height: 1.6; }
.doc-card .snippet mark { background: #fff2b3; color: inherit; }
.doc-card .foot { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.doc-card .foot .grow { flex: 1; }

/* chat */
.chat { flex: 1; overflow: auto; padding: var(--space-6) 0; }
.chat-inner { max-width: 820px; margin: 0 auto; padding: 0 32px; display: flex; flex-direction: column; gap: var(--space-4); }
.msg-user { align-self: flex-end; background: var(--accent-subtle); padding: var(--space-3) var(--space-4); border-radius: var(--radius-card); max-width: 80%; line-height: 1.7; }
.msg-user .mention { color: var(--accent); font-weight: 600; }
.msg-ai { line-height: 1.7; }
.tool-card { border: 1px solid var(--border-default); border-radius: var(--radius-card); background: var(--surface-raised); overflow: hidden; }
.tool-card .tc-head { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); background: var(--surface-subtle); border-bottom: 1px solid var(--border-subtle); }
.tool-card .tc-body { padding: var(--space-4); display: grid; gap: var(--space-3); }
.tool-card .preview { border: 1px solid var(--border-subtle); border-left: 3px solid var(--success); background: #f6fbf9; border-radius: 8px; padding: var(--space-3); white-space: pre-wrap; line-height: 1.7; }
.tool-card .tc-foot { display: flex; gap: var(--space-2); justify-content: flex-end; padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border-subtle); align-items: center; }
.tool-card .tc-foot .grow { flex: 1; }
.cite { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--border-default); border-radius: 999px; padding: 1px 8px 1px 3px; font-size: var(--font-caption); background: var(--surface-raised); }
.composer { border-top: 1px solid var(--border-subtle); padding: var(--space-3) 0 var(--space-5); }
.composer-inner { max-width: 820px; margin: 0 auto; padding: 0 32px; position: relative; }
.composer-box { background: var(--surface-raised); border: 1px solid var(--border-default); border-radius: var(--radius-card); padding: var(--space-3); }
.composer-box .input { min-height: 40px; line-height: 1.6; }
.composer-box .bar { display: flex; gap: var(--space-2); align-items: center; margin-top: var(--space-2); }
.mention-pop { position: absolute; bottom: 100%; left: 32px; width: 360px; background: var(--surface-raised); border: 1px solid var(--border-default); border-radius: var(--radius-card); box-shadow: var(--shadow-dialog); padding: var(--space-2); margin-bottom: var(--space-2); }
.mention-pop .item { display: flex; gap: var(--space-2); align-items: center; padding: 6px var(--space-2); border-radius: 8px; }
.mention-pop .item.active { background: var(--accent-subtle); }
.mention-pop .item .grow { flex: 1; }
.hidden { display: none !important; }
.caps { display: flex; gap: var(--space-1); flex-wrap: wrap; margin-top: var(--space-1); }
.cap { display: inline-flex; align-items: center; gap: 4px; font-size: var(--font-caption); padding: 1px 8px; border-radius: 6px; border: 1px solid var(--border-subtle); color: var(--text-secondary); background: var(--surface-subtle); }
.cap::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--border-control); }
.cap.on::before { background: var(--success); }
.cap.err::before { background: var(--danger); }
.cap.na { opacity: .55; }
.cap.na::before { display: none; }
.cred { border: 1px solid var(--border-subtle); border-radius: var(--radius-control); padding: var(--space-3) var(--space-4); display: grid; gap: var(--space-2); }
.cred .head { display: flex; align-items: center; gap: var(--space-2); }
.cred .head strong { flex: 1; }
.cred .actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
textarea.input { width: 100%; min-height: 72px; border: 1px solid var(--border-control); border-radius: 8px; padding: var(--space-2) var(--space-3); font: inherit; resize: vertical; }
.form-row { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: var(--space-3); align-items: center; }
.form-row > label { color: var(--text-secondary); }
.form-row input[type=text], .form-row input[type=password] { min-height: 32px; border: 1px solid var(--border-control); border-radius: 8px; padding: 0 var(--space-3); width: 100%; }
.inline { display: flex; gap: var(--space-2); align-items: center; }
.inline > input { flex: 1; }
.qr { width: 168px; height: 168px; display: grid; grid-template-columns: repeat(21, 1fr); gap: 0; padding: 8px; background: #fff; border: 1px solid var(--border-default); border-radius: 8px; margin: 0 auto; }
.qr i { background: #fff; }
.qr i.b { background: #17263a; }
.settings-shell { display: grid; grid-template-columns: minmax(160px, 220px) minmax(0, 1fr); height: 100%; min-height: 0; }
.settings-shell nav { border-right: 1px solid var(--border-subtle); padding: var(--space-3); overflow: auto; background: var(--surface-subtle); }
.settings-shell nav .cat-group { font-size: var(--font-caption); color: var(--text-muted); margin: var(--space-3) var(--space-3) var(--space-1); }
.settings-shell nav .nav-item small { display: block; color: var(--text-muted); font-size: var(--font-caption); font-weight: 400; }
.settings-shell nav .nav-item { flex-direction: column; align-items: flex-start; gap: 0; }
.settings-shell section { padding: var(--space-5) var(--space-6); overflow: auto; }
.src-badge { display: inline-flex; gap: 6px; align-items: center; font-size: var(--font-caption); color: var(--text-secondary); }
.msg-channel { align-self: flex-start; background: var(--surface-raised); border: 1px solid var(--border-subtle); padding: var(--space-3) var(--space-4); border-radius: var(--radius-card); max-width: 80%; line-height: 1.7; }
.msg-channel .who { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-1); font-size: var(--font-caption); color: var(--text-secondary); }
.chat-title { padding: var(--space-3) 32px; border-bottom: 1px solid var(--border-subtle); display: flex; gap: var(--space-2); align-items: center; background: rgb(255 255 255 / 50%); }
.chat-title .grow { flex: 1; }
th.col-c, td.col-c { background: #fbf8f1; }
@media (max-width: 900px) {
  .sidebar { width: 180px; }
  .app-page { grid-template-columns: minmax(0, 1fr); }

/* 现有工作区应用（示意，行为不变） */

const dmLabel = { self: '仅我自己', allowlist: '白名单', pairing: '配对审批', off: '关闭' }

let scene = 'center', settingsApp = 'feishu', settingsTab = 'connect', connectStep = 0, connectApp = 'feishu', connectMode = 'scan', pageFilter = 'all', pageApp = 'feishu'

/* ================= 工具函数 ================= */

const logo = (id, lg) => `<span class="logo ${id}${lg ? ' lg' : ''}">${apps[id].short}</span>`

const stateBadge = a => ({ ok: '<span class="badge ok">● 已连接</span>', off: '<span class="badge">已关闭</span>', unset: '<span class="badge">未配置</span>' })[state(a)]
function chips(id) {
  const a = apps[id]

  const t = a.tools.length ? a.tools.filter(x => x[3]).map(x => `<span class="cap on">${x[1]}</span>`).join('') : '<span class="cap na">只有消息</span>'
  return `<div class="caps"><span class="cap on">消息 · ${dmLabel[a.dm]}</span>${t}</div>`
}
function qr() {
  let s = ''
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
    const f = (x < 7 && y < 7) || (x >= 14 && y < 7) || (x < 7 && y >= 14)
    let b
    if (f) { const cx = x >= 14 ? x - 14 : x, cy = y >= 14 ? y - 14 : y; b = cx === 0 || cx === 6 || cy === 0 || cy === 6 || (cx >= 2 && cx <= 4 && cy >= 2 && cy <= 4) }
    else b = ((x * 7 + y * 13 + x * y) % 5) < 2
    s += `<i class="${b ? 'b' : ''}"></i>`
  }
  return `<div class="qr">${s}</div>`
}
function setScene(next) {

}

/* ================= 事件 ================= */
document.addEventListener('click', e => {
  const close = e.target.closest('[data-wb-close]')
  if (close) { const k = close.dataset.wbClose; wbOpen = wbOpen.filter(x => x !== k); if (wbTab === k) wbTab = wbOpen[0] ?? 'tasks'; return render() }
  const t = e.target.closest('button, [data-filter], [data-scene], input[name=mode]')
  if (!t) return
  if (t.hasAttribute('data-wb-menu')) { wbMenu = !wbMenu; return render() }
  if (t.dataset.wbOpen) { const k = t.dataset.wbOpen; if (!wbOpen.includes(k)) wbOpen.push(k); wbTab = k; wbMenu = false; pageFilter = 'all'; return render() }
  if (t.dataset.wb) { wbTab = t.dataset.wb; wbMenu = false; pageFilter = 'all'; return render() }
  if (t.id === 'app-menu-trigger') return $('#app-menu').classList.toggle('hidden')
  if (t.hasAttribute('data-close')) return setScene('chat')
  if (t.dataset.mode) { connectMode = t.dataset.mode; return render() }
  if (t.name === 'mode') { connectMode = t.value; return render() }
  if (t.dataset.scene) {
    if (t.dataset.channel) channelApp = t.dataset.channel
    if (t.dataset.panel) { const k = t.dataset.panel; if (!wbOpen.includes(k)) wbOpen.push(k); wbTab = k; pageFilter = 'all' }
    if (t.dataset.scene === 'connect') { if (t.dataset.app) connectApp = t.dataset.app; connectStep = 0 }
    else if (t.dataset.app) settingsApp = t.dataset.app
    if (t.dataset.tab) settingsTab = t.dataset.tab
    return setScene(t.dataset.scene)
  }
  if (t.dataset.nav) return setScene(t.dataset.nav)
  if (t.dataset.tab) { settingsTab = t.dataset.tab; return render() }
  if (t.dataset.step) { connectStep = Number(t.dataset.step); return render() }
  if (t.dataset.filter) { pageFilter = t.dataset.filter; return render() }
})
// 深链接：?s=settings&a=wecom&t=tools 或 #settings/wecom/tools
const q = new URLSearchParams(location.search)
const [hs, ha, ht] = q.get('s') ? [q.get('s'), q.get('a'), q.get('t')] : location.hash.slice(1).split('/')
if (hs === 'connect' && ha) connectApp = ha; else if (hs === 'chat' && ha) { wbTab = ha; if (isPlatform(ha) && !wbOpen.includes(ha)) wbOpen.push(ha) } else if (hs === 'channel-chat' && ha) channelApp = ha; else if (ha) settingsApp = ha
if (ht) settingsTab = ht
if (hs) setScene(hs); else render()
</script>
